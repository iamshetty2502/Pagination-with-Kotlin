plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace = "com.sample.pagination"
    compileSdk = 36
    defaultConfig {
        applicationId "com.sample.pagination"
        minSdk = 26
        targetSdk = 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BASE_URL", "\"https://api.yelp.com\""
        buildConfigField "String", "AUTH_TOKEN", "\"YOUR_API_KEY\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

kotlin {
    jvmToolchain(17)
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "com.google.android.material:material:1.14.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.android.support:multidex:1.0.3'

    //used for pagination
    implementation 'androidx.paging:paging-common-ktx:3.5.0'
    implementation "androidx.paging:paging-runtime-ktx:3.5.0"

    //used for retrofit
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation("com.google.code.gson:gson:2.14.0")

    //used to load image in Imageview
    implementation 'com.github.bumptech.glide:glide:5.0.7'

    //used for coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    //used for LifeCycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.10.0"

    //Used for dependency injection
    implementation "com.google.dagger:hilt-android:2.59.2"
    kapt "com.google.dagger:hilt-compiler:2.59.2"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}